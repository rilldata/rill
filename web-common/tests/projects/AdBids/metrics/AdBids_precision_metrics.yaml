# Metrics view YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/metrics-views

# Exercised by web-local/tests/explores/exact-measures.spec.ts.
# The name must sort after `AdBids_metrics`: the canvas editor defaults a new
# widget to the first metrics view with a time dimension, and
# web-local/tests/canvas/setup.spec.ts expects that to be `AdBids_metrics`.

version: 1
type: metrics_view

display_name: Adbids precision
table: AdBids_model
timeseries: timestamp

dimensions:
  - name: publisher
    display_name: Publisher
    column: publisher
  - name: domain
    display_name: Domain
    column: domain

measures:
  - name: total_records
    display_name: Total records
    expression: COUNT(*)
    format_preset: humanize
  # A default with an exact variant. The two expressions differ on purpose so
  # tests can tell which one answered. The default is deterministic rather than
  # a real approximation: `approx_count_distinct(publisher)` returned 3 for the
  # four publishers, and its result may change with the DuckDB version.
  - name: publishers
    display_name: Publishers
    expression: count(DISTINCT publisher) + 1000
    exact_expression: count(DISTINCT publisher)
    format_preset: none
  - name: records_per_publisher
    display_name: Records per publisher
    requires: [total_records, publishers]
    expression: total_records / publishers
    format_d3: ",.1f"
