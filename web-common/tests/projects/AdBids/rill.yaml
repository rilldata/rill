compiler: rillv1

display_name: "Untitled Rill Project"

embeds:
  # Served by web-admin/tests/embed-host (EMBED_HOST_ORIGIN).
  open_url: http://localhost:4300/open.html

features:
  chat: false
  # Enabled for embed users only, so web-admin/tests/embedded-personal-canvases.spec.ts can manage personal canvases from an embed.
  personal_canvases: "{{ .user.embed }}"
  embedded_bookmarks: "{{ .user.embed }}"
  # Overrides the default of `{{ not .user.embed }}`, so web-admin/tests/embedded-reports.spec.ts can create reports from an embed.
  reports: true
