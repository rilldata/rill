coverage:
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      # Each suite has a comparable baseline; do not aggregate unrelated or
      # historically different reports into Codecov's implicit project status.
      default: false
      go-hermetic:
        flags: [go-hermetic]
        target: auto
        threshold: 1%
      web-admin:
        flags: [web-admin]
        target: auto
        threshold: 1%
      web-common:
        flags: [web-common]
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

flags:
  # Keep this separate from the legacy `go` flag, whose history includes live
  # provider contracts and is not comparable to the hermetic PR suite.
  go-hermetic:
    paths:
      - admin/
      - cli/
      - runtime/
      - scripts/
    carryforward: false
  web-admin:
    paths:
      - web-admin/src/
    carryforward: false
  web-common:
    paths:
      - web-common/src/
    carryforward: false

ignore:
  - "**/proto/gen/**"
  - "admin/testadmin/**"
  - "runtime/testruntime/**"
  - "web-admin/src/client/gen/**"
  - "web-admin/src/runtime-client/**/gen/**"
  - "web-common/src/lib/i18n/gen/**"
