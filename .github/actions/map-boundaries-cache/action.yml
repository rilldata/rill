name: Cache map boundaries
description: >-
  Restores the map boundaries generated by web-common/scripts/generate-map-boundaries.ts,
  so builds skip downloading Natural Earth data when the inputs are unchanged.
  On a cache miss, the build generates them and they are saved at the end of the job.
  Requires Node.js; must run before the web-local or web-admin build.
runs:
  using: composite
  steps:
    - name: Compute map boundaries cache key
      id: key
      shell: bash
      # The script and the mapshaper version determine the output, matching the script's own stamp.
      # The version is read from the lockfile, since this may run before `npm install`.
      run: |-
        version=$(node -p 'Object.entries(require("./package-lock.json").packages).find(([path]) => path.endsWith("node_modules/mapshaper"))[1].version')
        echo "key=map-boundaries-mapshaper-${version}-${{ hashFiles('web-common/scripts/generate-map-boundaries.ts') }}" >> "$GITHUB_OUTPUT"

    - name: Cache map boundaries
      uses: actions/cache@v4
      with:
        path: web-common/static/map-boundaries
        key: ${{ steps.key.outputs.key }}
