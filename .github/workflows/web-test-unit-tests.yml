name: Unit tests for web code
on:
  pull_request:
    paths:
      - ".github/workflows/web-test-unit-tests.yml"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "web-admin/**"
      - "web-common/**"
      - "web-local/**"
      - "web-mcp-app/**"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter modified codepaths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - ".github/workflows/web-test-unit-tests.yml"
              - ".nvmrc"
              - "package.json"
              - "package-lock.json"
              - "web-admin/**"
              - "web-common/**"
            common:
              - ".github/workflows/web-test-unit-tests.yml"
              - ".nvmrc"
              - "package.json"
              - "package-lock.json"
              - "web-common/**"
            mcpapp:
              - ".github/workflows/web-test-unit-tests.yml"
              - ".nvmrc"
              - "package.json"
              - "package-lock.json"
              - "web-common/**"
              - "web-mcp-app/**"

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: NPM Install
        run: npm ci

      - name: Generate i18n files
        run: npm run build:i18n

      - name: Sync SvelteKit
        run: npm run generate:sveltekit -w web-common

      - name: Run web-common unit tests
        if: steps.filter.outputs.common == 'true'
        run: npm run test -w web-common

      - name: Run web-admin unit tests
        if: steps.filter.outputs.admin == 'true'
        run: npm run test:unit -w web-admin

      - name: Build the MCP App widget
        if: steps.filter.outputs.mcpapp == 'true'
        run: npm run build -w web-mcp-app

      - name: Run MCP App widget unit tests
        if: steps.filter.outputs.mcpapp == 'true'
        run: npm run test -w web-mcp-app

      - name: Install Playwright browsers for the MCP App widget
        if: steps.filter.outputs.mcpapp == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run MCP App widget browser tests
        if: steps.filter.outputs.mcpapp == 'true'
        run: npm run test:e2e -w web-mcp-app
