              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T07:30:00Z
        end: 2023-03-12T13:00:00Z
      time_zone: America/New_York
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
