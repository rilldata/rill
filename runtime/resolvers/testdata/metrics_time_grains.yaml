      - sum: 0
        time__2h: "2023-03-12T08:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T12:00:00Z"
  # 2023-03-12 is also the spring-forward day in Havana, where local midnight does not exist,
  # so the first bucket of the day starts at 01:00 CDT (05:00Z).
  - name: time_spine_6h_havana_dst_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__6h
          compute:
            time_floor:
              dimension: time
              grain: 6h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T05:00:00Z
        end: 2023-03-13T04:00:00Z
      time_zone: America/Havana
      sort:
        - name: time__6h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 64
        time__6h: "2023-03-12T05:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T16:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T22:00:00Z"
  - name: time_spine_6h_havana_dst_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: time__6h
          compute:
            time_floor:
              dimension: time
              grain: 6h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T05:00:00Z
        end: 2023-03-13T04:00:00Z
      time_zone: America/Havana
      sort:
        - name: time__6h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 64
        time__6h: "2023-03-12T05:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T16:00:00Z"
      - sum: 0
        time__6h: "2023-03-12T22:00:00Z"
  # 2023-10-29 is the fall-back day in Berlin, where local 02:00 happens twice, so the 02:00 bucket lasts three hours and holds both events.
  # DuckDB labels it with the second 02:00 (01:00Z) and ClickHouse with the first (00:00Z); each spine matches its engine's label.
  - name: time_spine_2h_berlin_dst_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__2h
          compute:
            time_floor:
              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-10-28T22:00:00Z
        end: 2023-10-29T07:00:00Z
      time_zone: Europe/Berlin
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 0
        time__2h: "2023-10-28T22:00:00Z"
      - sum: 384
        time__2h: "2023-10-29T01:00:00Z"
      - sum: 0
        time__2h: "2023-10-29T03:00:00Z"
      - sum: 0
        time__2h: "2023-10-29T05:00:00Z"
  - name: time_spine_2h_berlin_dst_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: time__2h
          compute:
            time_floor:
              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-10-28T22:00:00Z
        end: 2023-10-29T07:00:00Z
      time_zone: Europe/Berlin
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 0
        time__2h: "2023-10-28T22:00:00Z"
      - sum: 384
        time__2h: "2023-10-29T00:00:00Z"
      - sum: 0
        time__2h: "2023-10-29T03:00:00Z"
      - sum: 0
        time__2h: "2023-10-29T05:00:00Z"
  - name: time_spine_10m_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__10m
          compute:
            time_floor:
