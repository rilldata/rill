        time__6h: "2024-03-10T16:00:00Z"
      - sum: 32
        time__6h: "2024-03-10T22:00:00Z"
  # 2023-03-12 is the spring-forward day in New York: local 02:00 does not exist,
  # so the 02:00 bucket starts at 03:00 EDT (07:00Z) and the next one at 04:00 EDT (08:00Z).
  - name: time_spine_2h_new_york_dst_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__2h
          compute:
            time_floor:
              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T05:00:00Z
        end: 2023-03-12T13:00:00Z
      time_zone: America/New_York
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 0
        time__2h: "2023-03-12T05:00:00Z"
      - sum: 64
        time__2h: "2023-03-12T07:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T08:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T12:00:00Z"
  - name: time_spine_2h_new_york_dst_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: time__2h
          compute:
            time_floor:
              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T05:00:00Z
        end: 2023-03-12T13:00:00Z
      time_zone: America/New_York
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 0
        time__2h: "2023-03-12T05:00:00Z"
      - sum: 64
        time__2h: "2023-03-12T07:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T08:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T12:00:00Z"
  # A spine that starts in the bucket after the gap steps from that bucket's wall-clock start, 02:00, not from 03:00.
  - name: time_spine_2h_new_york_dst_gap_start_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__2h
          compute:
            time_floor:
              dimension: time
              grain: 2h
      measures:
        - name: sum
      time_range:
        start: 2023-03-12T07:30:00Z
        end: 2023-03-12T13:00:00Z
      time_zone: America/New_York
      sort:
        - name: time__2h
      spine:
        time:
          start:
          end:
          grain:
    result:
      - sum: 64
        time__2h: "2023-03-12T07:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T08:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T10:00:00Z"
      - sum: 0
        time__2h: "2023-03-12T12:00:00Z"
