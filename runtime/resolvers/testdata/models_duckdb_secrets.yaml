project_files:
  rill.yaml:
    olap_connector: duckdb
  s3.yaml:
    type: connector
    driver: s3
    aws_access_key_id: dummy
    aws_secret_access_key: dummy
    region: us-east-1
    # Skips the STS credentials check on connector reconcile.
    endpoint: http://localhost:9000
  # Secrets from connectors must exist before pre_exec runs, e.g. for ATTACHing an S3 Tables catalog.
  secret_in_pre_exec.yaml:
    type: model
    connector: duckdb
    materialize: true
    create_secrets_from_connectors: s3
    pre_exec: SELECT CASE WHEN count(*) = 0 THEN error('no s3 secret in pre_exec') END FROM duckdb_secrets() WHERE type = 's3'
    sql: SELECT 1 AS ok
tests:
  - name: secret_in_pre_exec
    resolver: sql
    properties:
      sql: SELECT ok FROM secret_in_pre_exec
    result:
      - ok: 1
