project_files:
  duckdb_data.yaml:
    type: model
    connector: duckdb
    sql: |
      select '2024-01-01T00:00:00Z'::TIMESTAMP as time, 1 as val union all
      select '2024-02-01T00:00:00Z'::TIMESTAMP as time, 2 as val union all
      select '2024-03-01T00:00:00Z'::TIMESTAMP as time, 3 as val
  time_end_duckdb_annotation.yaml:
    type: model
    connector: duckdb
    sql: |
      select '2024-01-05T00:00:00Z'::TIMESTAMP as time, NULL::TIMESTAMP as time_end, 'point before' as description
      union all
      select '2024-01-20T00:00:00Z'::TIMESTAMP as time, '2024-02-05T00:00:00Z'::TIMESTAMP as time_end, 'range crossing start' as description
      union all
      select '2024-02-10T00:00:00Z'::TIMESTAMP as time, NULL::TIMESTAMP as time_end, 'point inside' as description
      union all
      select '2024-02-16T00:00:00Z'::TIMESTAMP as time, '2024-02-20T00:00:00Z'::TIMESTAMP as time_end, 'range inside' as description
      union all
      select '2024-02-25T00:00:00Z'::TIMESTAMP as time, '2024-03-10T00:00:00Z'::TIMESTAMP as time_end, 'range crossing end' as description
      union all
      select '2024-03-05T00:00:00Z'::TIMESTAMP as time, NULL::TIMESTAMP as time_end, 'point after' as description
      union all
      select '2024-03-06T00:00:00Z'::TIMESTAMP as time, '2024-03-08T00:00:00Z'::TIMESTAMP as time_end, 'range after' as description
  duckdb_metrics.yaml:
    type: metrics_view
    model: duckdb_data
    timeseries: time
    measures:
      - name: sum
        expression: sum(val)
    annotations:
      - model: time_end_duckdb_annotation
tests:
  # Point annotations have a null time_end and are selected when their time falls in the range.
  # Range annotations are selected when they overlap the range, even when only partially.
  - name: annotations_overlapping_the_time_range
    resolver: metrics_annotations
    properties:
      metrics_view: duckdb_metrics
      time_range:
        start: 2024-02-01T00:00:00Z
        end: 2024-03-01T00:00:00Z
    result:
      - time: "2024-01-20T00:00:00Z"
        time_end: "2024-02-05T00:00:00Z"
        description: "range crossing start"
        for_measures: ['sum']
      - time: "2024-02-10T00:00:00Z"
        time_end: null
        description: "point inside"
        for_measures: ['sum']
      - time: "2024-02-16T00:00:00Z"
        time_end: "2024-02-20T00:00:00Z"
        description: "range inside"
        for_measures: ['sum']
      - time: "2024-02-25T00:00:00Z"
        time_end: "2024-03-10T00:00:00Z"
        description: "range crossing end"
        for_measures: ['sum']
  # A range that ends exactly when the time range starts does not overlap it.
  - name: range_ending_at_the_start_is_excluded
    resolver: metrics_annotations
    properties:
      metrics_view: duckdb_metrics
      time_range:
        start: 2024-02-05T00:00:00Z
        end: 2024-02-09T00:00:00Z
    result: []
  # Without a time range, the metrics view's full time range is used.
  - name: annotations_without_time_range
    resolver: metrics_annotations
    properties:
      metrics_view: duckdb_metrics
    result:
      - time: "2024-01-05T00:00:00Z"
        time_end: null
        description: "point before"
        for_measures: ['sum']
      - time: "2024-01-20T00:00:00Z"
        time_end: "2024-02-05T00:00:00Z"
        description: "range crossing start"
        for_measures: ['sum']
      - time: "2024-02-10T00:00:00Z"
        time_end: null
        description: "point inside"
        for_measures: ['sum']
      - time: "2024-02-16T00:00:00Z"
        time_end: "2024-02-20T00:00:00Z"
        description: "range inside"
        for_measures: ['sum']
      - time: "2024-02-25T00:00:00Z"
        time_end: "2024-03-10T00:00:00Z"
        description: "range crossing end"
        for_measures: ['sum']
