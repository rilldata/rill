project_files:
  data.yaml:
    type: model
    connector: duckdb
    sql: |
      select '2024-01-01T00:00:00Z'::TIMESTAMP as time, 'DK' as country, 1 as val union all
      select '2024-01-02T00:00:00Z'::TIMESTAMP as time, 'US' as country, 2 as val union all
      select '2024-01-03T00:00:00Z'::TIMESTAMP as time, 'US' as country, 3 as val union all
      select '2024-01-04T00:00:00Z'::TIMESTAMP as time, 'US' as country, 4 as val union all
      select '2024-01-05T00:00:00Z'::TIMESTAMP as time, 'DK' as country, 5 as val
  metrics_no_security.yaml:
    type: metrics_view
    model: data
    timeseries: time
    dimensions:
      - column: country
    measures:
      - name: count
        expression: count(*)
      - name: sum
        expression: sum(val)
tests:
  - name: additional_rules_with_subquery
    resolver: metrics
    properties:
      metrics_view: metrics_no_security
      dimensions:
        - name: country
      measures:
        - name: sum
    additional_rules:
      - row_filter: country IN (SELECT country FROM metrics_no_security HAVING count > 2)
    result:
      - country: US
        sum: 9
  # The following tests run the same query back-to-back with identical (empty) user attributes,
  # varying only the additional rules and skipped security checks.
  # They protect against cached results leaking across different security contexts.
  - name: cache_isolation_row_filter_dk
    resolver: metrics
    properties:
      metrics_view: metrics_no_security
      dimensions:
        - name: country
      measures:
        - name: sum
      sort:
        - name: country
    additional_rules:
      - row_filter: country = 'DK'
    result:
      - country: DK
        sum: 6
  - name: cache_isolation_row_filter_us
    resolver: metrics
    properties:
      metrics_view: metrics_no_security
      dimensions:
        - name: country
      measures:
        - name: sum
      sort:
        - name: country
    additional_rules:
      - row_filter: country = 'US'
    result:
      - country: US
        sum: 9
  - name: cache_isolation_no_rules
    resolver: metrics
    properties:
      metrics_view: metrics_no_security
      dimensions:
        - name: country
      measures:
        - name: sum
      sort:
        - name: country
    result:
      - country: DK
        sum: 6
      - country: US
        sum: 9
  - name: cache_isolation_skip_checks
    resolver: metrics
    properties:
      metrics_view: metrics_no_security
      dimensions:
        - name: country
      measures:
        - name: sum
      sort:
        - name: country
    skip_security_checks: true
    result:
      - country: DK
        sum: 6
      - country: US
        sum: 9
