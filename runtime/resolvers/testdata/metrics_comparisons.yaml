connectors:
  - clickhouse
  - druid
project_files:
  clickhouse_data.yaml:
    type: model
    connector: clickhouse
    output: clickhouse
    sql: |
      select parseDateTimeBestEffort('2024-01-01T00:00:00Z') as time, 'DK' as country, 1 as val union all
      select parseDateTimeBestEffort('2024-01-02T00:00:00Z') as time, 'US' as country, 2 as val union all
      select parseDateTimeBestEffort('2024-01-03T00:00:00Z') as time, 'US' as country, 3 as val union all
      select parseDateTimeBestEffort('2024-01-04T00:00:00Z') as time, 'US' as country, 4 as val union all
      select parseDateTimeBestEffort('2024-01-05T00:00:00Z') as time, 'DK' as country, 5 as val
  clickhouse_metrics.yaml:
    type: metrics_view
    model: clickhouse_data
    timeseries: time
    dimensions:
      - column: country
    measures:
      - name: count
        expression: count(*)
      - name: sum
        expression: sum(val)
  druid_metrics.yaml:
    type: metrics_view
    connector: druid
    model: AdBids
    timeseries: __time
    dimensions:
      - column: publisher
      - column: domain
    measures:
      - name: count
        expression: count(*)
  duckdb_data.yaml:
    type: model
    connector: duckdb
    sql: |
      select '2024-01-01T00:00:00Z'::TIMESTAMP as time, 'DK' as country, 1 as val union all
      select '2024-01-02T00:00:00Z'::TIMESTAMP as time, 'US' as country, 2 as val union all
      select '2024-01-03T00:00:00Z'::TIMESTAMP as time, 'US' as country, 3 as val union all
      select '2024-01-04T00:00:00Z'::TIMESTAMP as time, 'US' as country, 4 as val union all
      select '2024-01-05T00:00:00Z'::TIMESTAMP as time, 'DK' as country, 5 as val
  duckdb_metrics.yaml:
    type: metrics_view
    model: duckdb_data
    timeseries: time
    dimensions:
      - column: country
    measures:
      - name: count
        expression: count(*)
      - name: sum
        expression: sum(val)
  duckdb_snapshots.yaml:
    type: model
    connector: duckdb
    sql: |
      select '2024-01-03'::DATE as day, 'B' as account, 30 as val union all
      select '2024-01-04'::DATE as day, 'A' as account, 40 as val union all
      select '2024-01-04'::DATE as day, 'B' as account, 41 as val union all
      select '2024-01-05'::DATE as day, 'A' as account, 50 as val union all
      select '2024-01-05'::DATE as day, 'B' as account, 51 as val
  duckdb_snapshots_metrics.yaml:
    type: metrics_view
    model: duckdb_snapshots
    timeseries: day
    dimensions:
      - column: account
    measures:
      - name: sum
        expression: sum(val)
tests:
  - name: time_as_dimension_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: time__day
          compute:
            time_floor:
              dimension: time
              grain: day
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        end: 2024-01-05T00:00:00Z
        start: 2024-01-03T00:00:00Z
      comparison_time_range:
        end: 2024-01-03T00:00:00Z
        start: 2024-01-01T00:00:00Z
      sort:
        - name: time__day
    result:
      - sum: 3
        sum_prev: 1
        time__day: "2024-01-03T00:00:00Z"
      - sum: 4
        sum_prev: 2
        time__day: "2024-01-04T00:00:00Z"
  - name: time_as_dimension_druid
    resolver: metrics
    properties:
      metrics_view: druid_metrics
      dimensions:
        - name: time__day
          compute:
            time_floor:
              dimension: __time
              grain: day
      measures:
        - name: count
        - name: count_prev
          compute:
            comparison_value:
              measure: count
      time_range:
        end: 2022-01-05T00:00:00Z
        start: 2022-01-03T00:00:00Z
      comparison_time_range:
        end: 2022-01-03T00:00:00Z
        start: 2022-01-01T00:00:00Z
      sort:
        - name: time__day
    result:
      - count: 1126
        count_prev: 1116
        time__day: "2022-01-03T00:00:00Z"
      - count: 1120
        count_prev: 1126
        time__day: "2022-01-04T00:00:00Z"
  - name: time_as_dimension_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__day
          compute:
            time_floor:
              dimension: time
              grain: day
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        end: 2024-01-05T00:00:00Z
        start: 2024-01-03T00:00:00Z
      comparison_time_range:
        end: 2024-01-03T00:00:00Z
        start: 2024-01-01T00:00:00Z
      sort:
        - name: time__day
    result:
      - sum: 3
        sum_prev: 1
        time__day: "2024-01-03T00:00:00Z"
      - sum: 4
        sum_prev: 2
        time__day: "2024-01-04T00:00:00Z"
  - name: time_as_dimension_check_cache_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: time__day
          compute:
            time_floor:
              dimension: time
              grain: day
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        end: 2024-01-04T00:00:00Z
        start: 2024-01-03T00:00:00Z
      comparison_time_range:
        end: 2024-01-02T00:00:00Z
        start: 2024-01-01T00:00:00Z
      sort:
        - name: time__day
    result:
      - sum: 3
        sum_prev: 1
        time__day: "2024-01-03T00:00:00Z"
  - name: iso_ranges_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: country
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        iso_duration: P2D
      comparison_time_range:
        iso_duration: P2D
        iso_offset: P2D
      sort:
        - name: sum
    result:
      - country: US
        sum: 7
        sum_prev: 2
  - name: iso_ranges_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: country
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        iso_duration: P2D
      comparison_time_range:
        iso_duration: P2D
        iso_offset: P2D
      sort:
        - name: sum
    result:
      - country: US
        sum: 7
        sum_prev: 2
  - name: rill_time_ranges_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      dimensions:
        - name: country
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        expression: '3D as of watermark/D+1D'
      comparison_time_range:
        expression: '3D as of -3D as of watermark/D+1D'
      sort:
        - name: sum
    result:
      - country: DK
        sum: 5
        sum_prev: 1
      - country: US
        sum: 7
        sum_prev: 2
  - name: rill_time_ranges_clickhouse
    resolver: metrics
    properties:
      metrics_view: clickhouse_metrics
      dimensions:
        - name: country
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        expression: '3D as of watermark/D+1D'
      comparison_time_range:
        expression: '3D as of -3D as of watermark/D+1D'
      sort:
        - name: sum
    result:
      - country: DK
        sum: 5
        sum_prev: 1
      - country: US
        sum: 7
        sum_prev: 2
  # Clients send the comparison for a legacy expression as the expression in iso_duration with an iso_offset;
  # the comparison must be the base range shifted by the offset.
  - name: legacy_comparison_of_expression_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        expression: P1D
      comparison_time_range:
        iso_duration: P1D
        iso_offset: rill-PD
    result:
      - sum: 5
        sum_prev: 4
  - name: legacy_previous_period_of_expression_duckdb
    resolver: metrics
    properties:
      metrics_view: duckdb_metrics
      measures:
        - name: sum
        - name: sum_prev
          compute:
            comparison_value:
              measure: sum
      time_range:
        expression: P2D
      comparison_time_range:
        iso_duration: P2D
        iso_offset: P2D
    result:
      - sum: 9
        sum_prev: 5
  # Alerts run legacy queries at the watermark plus a second and pin the end of legacy ranges to it.
  - name: legacy_comparison_of_expression_alert_duckdb
    resolver: legacy_metrics
    properties:
      query_name: MetricsViewAggregation
      query_args_json: '{"metricsView":"duckdb_snapshots_metrics","dimensions":[{"name":"account"}],"measures":[{"name":"sum"},{"name":"sum_delta","comparisonDelta":{"measure":"sum"}}],"timeRange":{"expression":"P1D","timeZone":"UTC"},"comparisonTimeRange":{"isoDuration":"P1D","isoOffset":"rill-PD"},"sort":[{"name":"sum","desc":true}]}'
    args:
      execution_time: 2024-01-05T00:00:01Z
    result:
      - account: B
        sum: 51
        sum_delta: 10
      - account: A
        sum: 50
        sum_delta: 10
