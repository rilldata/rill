<!doctype html>
<html lang="%lang%">
  <head>
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <!-- preloaded fonts -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/source-code/SourceCodePro-VariableFont_wght.ttf"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Regular.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Medium.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-SemiBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-Bold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter/Inter-ExtraBold.woff2?v=3.19"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="utf-8" />
    <!-- maximum-scale suppresses the iOS auto-zoom on sub-16px inputs; since
         iOS 10 Safari ignores it for user-initiated pinch zoom, so it does
         not restrict accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <!-- Set the og image for thumbnail previews -->
    <meta
      property="og:image"
      content="https://storage.googleapis.com/prod-cdn.rilldata.com/images/rill-admin.png"
    />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
    <div id="rill-portal"></div>
  </body>
</html>
